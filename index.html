<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>芬兰实时公交查询 (稳健版)</title>
    <style>
        body { font-family: Arial, sans-serif; background: #f0f2f5; margin: 0; padding: 20px; color: #333; }
        .container { max-width: 500px; margin: 0 auto; background: white; padding: 20px; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        h2 { color: #0000bf; text-align: center; }
        .station-box { margin-bottom: 20px; }
        input { width: calc(100% - 22px); padding: 12px; font-size: 16px; border: 1px solid #ccc; border-radius: 6px; margin-bottom: 10px; }
        button { width: 100%; background: #0000bf; color: white; border: none; padding: 12px; font-size: 16px; border-radius: 6px; cursor: pointer; transition: background 0.3s; }
        button:hover { background: #000099; }
        .result-block { margin-top: 15px; }
        .stop-card { background: #f9f9f9; padding: 15px; border-radius: 8px; margin-bottom: 15px; border-left: 4px solid #0000bf; }
        .stop-name { font-weight: bold; font-size: 18px; color: #0000bf; margin-bottom: 10px; }
        .bus-item { display: flex; justify-content: space-between; padding: 10px 0; border-bottom: 1px solid #eee; align-items: center; }
        .bus-item:last-child { border-bottom: none; }
        .bus-line { font-weight: bold; font-size: 18px; background: #0000bf; color: white; padding: 4px 10px; border-radius: 4px; }
        .bus-time { font-size: 18px; color: #d9534f; font-weight: bold; }
        .headsign { font-size: 14px; color: #555; max-width: 60%; }
        .loading { text-align: center; color: #666; margin-top: 20px; }
    </style>
</head>
<body>

<div class="container">
    <h2>芬兰实时公交</h2>
    <div class="station-box">
        <label for="stopName">输入站名拼音 (例如 Kamppi):</label>
        <input type="text" id="stopName" value="Kamppi" placeholder="输入站名英文或拼音">
        <button onclick="searchStops()">查询实时倒计时</button>
    </div>
    
    <div id="results" class="result-block">
        <div class="loading">请输入站名并点击查询</div>
    </div>
</div>

<script>
async function searchStops() {
    const keyword = document.getElementById('stopName').value.trim();
    const resultsDiv = document.getElementById('results');
    resultsDiv.innerHTML = '<div class="loading">📡 正在连接 HSL 实时数据中心...</div>';

    if (!keyword) {
        resultsDiv.innerHTML = '<p style="color:red;">请输入站名后再查询。</p>';
        return;
    }

    try {
        // 第一步：使用标准的 REST 地理编码接口查找车站ID，该接口对手机和跨域更友好
        // 这个接口通常不需要复杂的 CORS 头部
        const geoUrl = `https://api.digitransit.fi/geocoding/v1/search?text=${encodeURIComponent(keyword)}&size=3`;
        const geoResponse = await fetch(geoUrl);
        
        if (!geoResponse.ok) {
            throw new Error(`车站查询失败 (错误码: ${geoResponse.status})`);
        }

        const geoData = await geoResponse.json();
        
        if (!geoData.features || geoData.features.length === 0) {
            resultsDiv.innerHTML = '<p>未找到该车站，请尝试其他拼写（如 Central Railway Station）。</p>';
            return;
        }

        let stopsHtml = '';

        // 第二步：遍历查找到的车站，并获取实时到站时间
        for (const feature of geoData.features) {
            const gtfsId = feature.properties.id; // 这就是用于 GraphQL 查询的 GTFS ID
            const stopName = feature.properties.name;

            // 如果找到的不是一个有效的GTFS ID，跳过
            if (!gtfsId || !gtfsId.startsWith('HSL')) continue;

            const stopTimesHtml = await getStopTimes(gtfsId);
            
            stopsHtml += `
                <div class="stop-card">
                    <div class="stop-name">📍 ${stopName}</div>
                    ${stopTimesHtml}
                </div>
            `;
        }

        if (!stopsHtml) {
            resultsDiv.innerHTML = '<p>未找到匹配的公交站或数据暂不可用。</p>';
        } else {
            resultsDiv.innerHTML = stopsHtml;
        }

    } catch (error) {
        console.error(error);
        resultsDiv.innerHTML = `<p style="color:red;">⚠️ 数据请求失败: ${error.message}<br>请尝试刷新网页或部署到 Netlify 后再使用。</p>`;
    }
}

// 辅助函数：根据车站 GTFS ID 获取实时车次时间
async function getStopTimes(gtfsId) {
    const query = `
      {
        stop(id: "${gtfsId}") {
          stoptimesWithoutPatterns(numberOfDepartures: 5) {
            realtimeArrival
            realtime
            trip {
              route {
                shortName
              }
              headsign
            }
          }
        }
      }
    `;

    try {
        // 更新为最新的 HSL v2 路由 API 接口
        const response = await fetch('https://api.digitransit.fi/routing/v2/hsl/gtfs/v1', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json',
                'Accept': 'application/json',
            },
            body: JSON.stringify({ query })
        });

        if (!response.ok) return '<p>无法获取该站车次数据。</p>';

        const data = await response.json();
        if (!data.data.stop || !data.data.stop.stoptimesWithoutPatterns) return '<p>暂无班次信息。</p>';

        const stoptimes = data.data.stop.stoptimesWithoutPatterns;
        if (stoptimes.length === 0) return '<p>近期没有班次记录</p>';

        let html = '<div>';
        
        // 关键改进：优化手机时间匹配
        const now = new Date();
        const currentSeconds = now.getHours() * 3600 + now.getMinutes() * 60 + now.getSeconds();
        
        stoptimes.forEach(time => {
            const routeName = time.trip.route.shortName;
            const headsign = time.trip.headsign;
            
            // 计算到站分钟数，HSL实时数据有时会有负值，需要处理
            const arrivalSeconds = time.realtimeArrival; 
            const waitMinutes = Math.max(0, Math.floor((arrivalSeconds - currentSeconds) / 60));

            const delayText = time.realtime ? '' : '<span style="color:#666; font-size:12px;">(计划)</span>';

            html += `
                <div class="bus-item">
                    <div>
                        <span class="bus-line">${routeName}</span> 
                        ${delayText}
                        <div class="headsign">往 ${headsign || '未知'}</div>
                    </div>
                    <div class="bus-time">${waitMinutes} 分钟后</div>
                </div>
            `;
        });
        html += '</div>';
        return html;

    } catch (e) {
        console.error(e);
        return '<p>获取车次失败。</p>';
    }
}
</script>

</body>
</html>
